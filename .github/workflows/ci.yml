# SPDX-License-Identifier: GPL-3.0-or-later
name: CPM Common V2 offline reader qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - name: Native Common V2 hosted and import-free tests
        run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
      - name: Independent cpmtools payload oracle (not a runtime backend)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpmtools
          mkfs.cpm -f pcw build/foreign.img
          truncate -s 184320 build/foreign.img
          dd if=/dev/urandom of=build/proof.bin bs=1 count=17003 status=none
          printf yes > build/note.txt
          cpmcp -f pcw build/foreign.img build/proof.bin 0:proof.bin
          cpmcp -f pcw build/foreign.img build/note.txt 3:note.txt
          cpmcp -f pcw build/foreign.img 0:proof.bin build/oracle.bin
          cmp build/proof.bin build/oracle.bin
          # Add the documented explicit JCE boot-spec markers in reserved
          # boot sectors; cpmtools creates the actual directory and file data.
          printf '\353' | dd of=build/foreign.img bs=1 seek=0 conv=notrunc status=none
          printf 'CP/M' | dd of=build/foreign.img bs=1 seek=43 conv=notrunc status=none
          printf 'DSK' | dd of=build/foreign.img bs=1 seek=51 conv=notrunc status=none
          printf 'CP/M' | dd of=build/foreign.img bs=1 seek=124 conv=notrunc status=none
          printf '\000\000\050\011\002\001\003\002' | dd of=build/foreign.img bs=1 seek=128 conv=notrunc status=none
          sha256sum build/foreign.img > build/before
          build/test_cpm ./build/CPM.so build/foreign.img build/proof.bin
          build/test_cpm ./build/freestanding/CPM.so build/foreign.img build/proof.bin
          sha256sum -c build/before
      - name: Sanitizer qualification
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  publish:
    needs: read-only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - name: Build, test and publish the exact native provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Published version is immutable; increment VERSION for another release."
            exit 0
          fi
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          sh scripts/build-release.sh portable dist
          common=$(git -C Libraries rev-parse HEAD)
          curl -fsSL --retry 3 "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" -o "$work/source.tar.gz"
          curl -fsSL --retry 3 "https://codeload.github.com/Infiltrator-Projects/Libraries/tar.gz/$common" -o "$work/common.tar.gz"
          source_hash=$(sha256sum "$work/source.tar.gz" | cut -d' ' -f1)
          common_hash=$(sha256sum "$work/common.tar.gz" | cut -d' ' -f1)
          run="dist/filesystem-cpm-$version-native-installer.run"
          sed -e "s/@SOURCE@/$GITHUB_SHA/g" -e "s/@COMMON@/$common/g" -e "s/@SOURCE_HASH@/$source_hash/g" -e "s/@COMMON_HASH@/$common_hash/g" -e "s/@VERSION@/$version/g" scripts/installer.in > "$run"
          chmod +x "$run"
          "$run" --profile aggressive --system-package-mode --build-only --output "$work/native"
          deb="infiltrator-filesystem-cpm_${version}_amd64.deb"
          pdf="System/Resources/Documentation/Filesystem-CPM.pdf"
          so="System/Filesystems/CPM.so"
          for package in "dist/$deb" "$work/native/$deb"; do
            test "$(dpkg-deb -f "$package" Package)" = 'infiltrator-filesystem-cpm'
            test "$(dpkg-deb -f "$package" Version)" = "$version"
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            expected=$(printf './%s\n' "$pdf" "$so" | sort)
            actual=$(dpkg-deb --fsys-tarfile "$package" | tar -tf - | grep -v '/$' | sort)
            test "$actual" = "$expected"
            dpkg-deb -x "$package" "$work/extract"
            cmp "docs/CPM.pdf" "$work/extract/$pdf"
            test "$(nm -D --defined-only "$work/extract/$so" | awk '{print $3}')" = infiltrator_filesystem_api_v2
          done
          test ! -e "/$pdf"
          test ! -e "/$so"
          sudo dpkg -i "$work/native/$deb"
          cmp "docs/CPM.pdf" "/$pdf"
          cmp "$work/extract/$so" "/$so"
          sudo dpkg --purge infiltrator-filesystem-cpm
          test ! -e "/$pdf"
          test ! -e "/$so"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          gh release create "v$version" --target "$GITHUB_SHA" --title "CPM v$version" --notes "Native bounded CP/M Plus read-only PCW180 provider for explicitly JCE-marked linear images. Exact-revision independent populated media and native package tests passed. Unmarked raw, alternate geometry, sparse records, password handling, mutation and physical BOOT not qualified." "dist/$deb" "$run"
